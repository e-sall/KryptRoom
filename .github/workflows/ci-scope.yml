name: CI Applicability Policy

on:
  pull_request:
    branches: [dev, main, 'feat/**']
  push:
    branches: [dev, main, 'feat/**', 'security/**', 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-applicability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-scope-classification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      core: ${{ steps.scope.outputs.core }}
      web: ${{ steps.scope.outputs.web }}
      m9: ${{ steps.scope.outputs.m9 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify positive and negative routing vectors
        run: python3 -m unittest discover -s .github -p 'test_*ci_scope.py' -v
      - name: Emit explicit applicability on the current event diff
        id: scope
        run: python3 .github/ci_scope.py
