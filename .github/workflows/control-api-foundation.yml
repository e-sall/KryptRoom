name: M9 Control API Foundation

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, 'feat/m9-control-api-foundation']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m9-control-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  m9-control-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/control-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify applicability without installing M9 dependencies
        id: scope
        run: python3 ../../.github/ci_scope.py
      - name: Explicit M9 non-applicability
        if: steps.scope.outputs.m9 != 'true'
        run: echo "M9 checks not applicable; classification succeeded"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.scope.outputs.m9 == 'true'
        with:
          python-version: '3.12.16'
      - name: Install the isolated hash-locked M9 toolchain
        if: steps.scope.outputs.m9 == 'true'
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Verify lock consistency, style and types
        if: steps.scope.outputs.m9 == 'true'
        run: |
          uv lock --check
          python scripts/check-locks.py
          ruff check .
          ruff format --check .
          mypy src
      - name: Unit, error, privacy and boundary tests
        if: steps.scope.outputs.m9 == 'true'
        run: python -m pytest -m 'not postgres' -v
      - name: Audit M9 runtime and development dependencies without exceptions
        if: steps.scope.outputs.m9 == 'true'
        run: |
          python -m pip_audit -r requirements.lock --require-hashes --disable-pip
          python -m pip_audit -r requirements-dev.lock --require-hashes --disable-pip
      - name: Build distribution
        if: steps.scope.outputs.m9 == 'true'
        run: python -m build --no-isolation
      - name: PostgreSQL 17 and container lifecycle acceptance
        if: steps.scope.outputs.m9 == 'true'
        run: |
          python scripts/local-secrets.py
          docker compose config --quiet
          python scripts/compose-acceptance.py
      - name: Remove disposable CI containers and database volume
        if: always() && steps.scope.outputs.m9 == 'true'
        run: docker compose --profile test down --volumes --remove-orphans
