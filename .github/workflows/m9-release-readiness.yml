name: M9 Release Readiness

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m9-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_IMAGE: node:22.23.5-alpine3.23@sha256:6868d4695b947ee120bffaa463fecd68cde370d7bfec92955e7c8ac576b4f475
  SCANNER_IMAGE: aquasec/trivy:0.76.2@sha256:6fa071ef8daa2e58b90cbf1710bedca91adbb3bf98693533226f442035b836a6
  POSTGRES_IMAGE: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
  KEYCLOAK_IMAGE: quay.io/keycloak/keycloak:26.8.2@sha256:3879c623248408de29a5303178b5816c77e8dfef3890c361f8c0bbeaa979ba3b

jobs:
  release-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      m9: ${{ steps.scope.outputs.m9 }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - name: Reject foreign unreviewed build sources
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false, fetch-depth: 0}
      - run: python3 -m unittest discover -s .github -p 'test_*.py' -v
      - id: scope
        run: python3 .github/ci_scope.py

  release-backend:
    needs: release-policy
    if: needs.release-policy.outputs.m9 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: kr-m9-release-backend
    defaults:
      run: {working-directory: services/control-api}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12.16'}
      - name: Reproduce, lint, type, test, audit and package
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
          uv lock --check
          python scripts/check-locks.py
          ruff check .
          ruff format --check .
          mypy src
          python -m pytest -m 'not postgres' -v
          python -m pip_audit -r requirements.lock --require-hashes --disable-pip
          python -m pip_audit -r requirements-dev.lock --require-hashes --disable-pip
          python -m build --no-isolation
      - name: Real PostgreSQL migrations, negative secrets, restart and readiness
        run: |
          python scripts/local-secrets.py
          docker compose config --quiet
          python scripts/compose-acceptance.py
          docker compose --profile test run --rm tests python -m pytest tests/test_release_postgres.py -vs
          python scripts/backup-restore-acceptance.py --disposable --container kr-m9-release-backend-postgres-1
      - name: Require supported patched PostgreSQL 17 before release
        run: |
          pg_version="$(docker compose exec -T postgres psql -XAt -U postgres -d postgres -c 'SHOW server_version_num')"
          case "$pg_version" in ''|*[!0-9]*) exit 1 ;; esac
          test "$pg_version" -ge 170012
          test "$pg_version" -lt 180000
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-python-distributions
          path: services/control-api/dist/
          if-no-files-found: error
      - name: Remove only disposable fixture
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans

  release-security:
    needs: release-policy
    if: needs.release-policy.outputs.m9 == 'true' || needs.release-policy.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Audit root and production frontend without lifecycle scripts
        run: |
          mkdir -p release-audits
          for scope in root web; do
            directory="$GITHUB_WORKSPACE"
            if [ "$scope" = web ]; then directory="$GITHUB_WORKSPACE/apps/web"; fi
            docker run --rm --cap-drop ALL --security-opt no-new-privileges:true --read-only --tmpfs /tmp -e HOME=/tmp -v "$directory/package.json:/input/package.json:ro" -v "$directory/package-lock.json:/input/package-lock.json:ro" "$NODE_IMAGE" sh -ec 'cd /tmp; cp /input/* .; npm audit --omit=dev --json --registry=https://registry.npmjs.org' > "release-audits/$scope-production.json"
          done
          docker run --rm --cap-drop ALL --security-opt no-new-privileges:true --read-only --tmpfs /tmp -e HOME=/tmp -v "$GITHUB_WORKSPACE/package.json:/input/package.json:ro" -v "$GITHUB_WORKSPACE/package-lock.json:/input/package-lock.json:ro" "$NODE_IMAGE" sh -ec 'cd /tmp; cp /input/* .; npm audit --json --registry=https://registry.npmjs.org' > release-audits/root-full.json
      - name: Strict frontend gate before frontend operations
        env:
          REVIEW_SOURCE_SHA: ${{ github.sha }}
          REVIEW_BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || vars.FRONTEND_REVIEW_BASELINE_SHA }}
          FRONTEND_SECURITY_EVIDENCE_JSON: ${{ vars.FRONTEND_SECURITY_EVIDENCE_JSON }}
        run: python3 .github/frontend_security_gate.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: release-security-evidence
          path: |
            frontend-security-evidence/
            release-audits/
          if-no-files-found: error

  release-packaging:
    needs: [release-policy, release-security, release-backend]
    if: needs.release-policy.outputs.m9 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run: {working-directory: services/control-api}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - name: Real OIDC PKCE BFF PostgreSQL acceptance
        run: sudo --preserve-env=DOCKER_CONFIG python3 scripts/identity-stack-acceptance.py --disposable
      - name: Build autonomous images and frontend validation target
        run: |
          docker build --target runtime -t kr-release-api .
          docker build --target runtime -t kr-release-web -f ../../apps/web/Dockerfile.identity ../../apps/web
          docker build --target acceptance -t kr-release-tests -f ../../apps/web/Dockerfile.identity ../../apps/web
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /run/browser-tmp --tmpfs /app/node_modules/.cache --tmpfs /app/node_modules/.vite-temp --tmpfs /app/node_modules/.vitest-cache --tmpfs /app/.next/cache --tmpfs /tmp -v "$GITHUB_WORKSPACE/docs:/docs:ro" --entrypoint sh kr-release-tests -ec 'npm run lint && npm run typecheck -- --incremental false && npm test'
          mkdir -p ../../release-images
          docker image inspect --format '{{.Id}}' kr-release-api > ../../release-images/api.id
          docker image inspect --format '{{.Id}}' kr-release-web > ../../release-images/web.id
          docker image save kr-release-api -o ../../release-images/api.tar
          docker image save kr-release-web -o ../../release-images/web.tar
          docker image inspect --format '{{.Id}}' "$POSTGRES_IMAGE" > ../../release-images/postgres.id
          docker image inspect --format '{{.Id}}' "$KEYCLOAK_IMAGE" > ../../release-images/keycloak.id
          docker image save "$POSTGRES_IMAGE" -o ../../release-images/postgres.tar
          docker image save "$KEYCLOAK_IMAGE" -o ../../release-images/keycloak.tar
      - name: Full offline image inventory and vulnerability scans without Docker socket
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p scanner-cache
          docker run --rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges:true --read-only --tmpfs /tmp -e HOME=/tmp -v "$PWD/scanner-cache:/cache" "$SCANNER_IMAGE" image --cache-dir /cache --download-db-only
          docker run --rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges:true --read-only --tmpfs /tmp -e HOME=/tmp -v "$PWD/scanner-cache:/cache" "$SCANNER_IMAGE" image --cache-dir /cache --download-java-db-only
          for image in api web postgres keycloak; do
            code=0
            docker run --rm --user "$(id -u):$(id -g)" --network none --cap-drop ALL --security-opt no-new-privileges:true --read-only --tmpfs /tmp -e HOME=/tmp -v "$PWD/scanner-cache:/cache" -v "$PWD/release-images:/images:ro" "$SCANNER_IMAGE" image --cache-dir /cache --skip-db-update --skip-java-db-update --offline-scan --scanners vuln --list-all-pkgs --input "/images/$image.tar" --format json --exit-code 1 > "release-images/$image.scan.json" || code=$?
            echo "$code" > "release-images/$image.scan.exit"
          done
          python3 .github/release_checks.py --source "$GITHUB_SHA" --directory release-images
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: release-image-evidence
          path: |
            release-images/*.json
            release-images/*.id
            release-images/*.exit
          if-no-files-found: error
      - name: Cleanup identity fixture
        if: always()
        run: docker compose -p kr-m9-pr2-real -f compose.identity.yml --profile operator down --volumes --remove-orphans

  release-ready:
    needs: [release-policy, release-backend, release-security, release-packaging]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      POLICY: ${{ needs.release-policy.result }}
      M9: ${{ needs.release-policy.outputs.m9 }}
      WEB: ${{ needs.release-policy.outputs.web }}
      BACKEND: ${{ needs.release-backend.result }}
      SECURITY: ${{ needs.release-security.result }}
      PACKAGING: ${{ needs.release-packaging.result }}
    steps:
      - name: Explicit release decision, never a skipped required check
        run: |
          test "$POLICY" = success
          if [ "$M9" = true ]; then
            test "$BACKEND" = success
            test "$SECURITY" = success
            test "$PACKAGING" = success
          elif [ "$WEB" = true ]; then
            test "$SECURITY" = success
            echo 'M9 backend/packaging explicitly not applicable; M8 workflow remains required'
          else
            test "$M9" = false
            test "$WEB" = false
            echo 'Release consumers explicitly not applicable; other required workflows remain required'
          fi
