name: Public Chain Anchor Live Acceptance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy, resume an immutable deployment, or resume one exact existing anchor
        required: true
        default: resume_existing_anchor
        type: choice
        options:
          - resume_existing_anchor
          - resume_existing_deployment
          - deploy
      confirmation:
        description: Type the exact mode-specific confirmation phrase
        required: true
        type: string
      existing_contract_address:
        description: Required for either resume mode (lowercase 0x address)
        required: false
        type: string
      existing_deployment_transaction:
        description: Required for either resume mode (lowercase 0x transaction hash)
        required: false
        type: string
      existing_anchor_transaction:
        description: Required only for resume_existing_anchor (lowercase 0x transaction hash)
        required: false
        type: string
      existing_anchor_log_index:
        description: Required only for resume_existing_anchor (decimal log index)
        required: false
        type: string
      expected_deployer_nonce:
        description: Required only for deploy; prevents a failed run from redeploying on retry
        required: false
        type: string

concurrency:
  group: public-chain-anchor-base-sepolia-v1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authoritative-base-sepolia:
    environment: base-sepolia-m7
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
      M7_TEST_ANCHOR_PRIVATE_KEY: ${{ secrets.M7_TEST_ANCHOR_PRIVATE_KEY }}
      M7_MODE: ${{ inputs.mode }}
      M7_CONFIRMATION: ${{ inputs.confirmation }}
      M7_EXISTING_CONTRACT: ${{ inputs.existing_contract_address }}
      M7_EXISTING_DEPLOYMENT_TX: ${{ inputs.existing_deployment_transaction }}
      M7_EXISTING_ANCHOR_TX: ${{ inputs.existing_anchor_transaction }}
      M7_EXISTING_ANCHOR_LOG_INDEX: ${{ inputs.existing_anchor_log_index }}
      M7_EXPECTED_DEPLOYER_NONCE: ${{ inputs.expected_deployer_nonce }}
    steps:
      - uses: actions/checkout@v7
      - name: Enforce explicit mutually exclusive mode gate
        run: |
          test -n "$BASE_SEPOLIA_RPC_URL"
          case "$M7_MODE" in
            deploy)
              test -n "$M7_TEST_ANCHOR_PRIVATE_KEY"
              test "$M7_CONFIRMATION" = 'DEPLOY BASE SEPOLIA M7 V1'
              test -z "$M7_EXISTING_CONTRACT"
              test -z "$M7_EXISTING_DEPLOYMENT_TX"
              test -z "$M7_EXISTING_ANCHOR_TX"
              test -z "$M7_EXISTING_ANCHOR_LOG_INDEX"
              [[ "$M7_EXPECTED_DEPLOYER_NONCE" =~ ^(0|[1-9][0-9]*)$ ]]
              test ! -e chain/deployments/base-sepolia-v1.json
              ;;
            resume_existing_deployment)
              test -n "$M7_TEST_ANCHOR_PRIVATE_KEY"
              test "$M7_CONFIRMATION" = 'RESUME BASE SEPOLIA M7 V1'
              [[ "$M7_EXISTING_CONTRACT" =~ ^0x[0-9a-f]{40}$ ]]
              [[ "$M7_EXISTING_DEPLOYMENT_TX" =~ ^0x[0-9a-f]{64}$ ]]
              test -z "$M7_EXISTING_ANCHOR_TX"
              test -z "$M7_EXISTING_ANCHOR_LOG_INDEX"
              test -z "$M7_EXPECTED_DEPLOYER_NONCE"
              ;;
            resume_existing_anchor)
              test "$M7_CONFIRMATION" = 'RESUME EXISTING BASE SEPOLIA M7 ANCHOR V1'
              [[ "$M7_EXISTING_CONTRACT" =~ ^0x[0-9a-f]{40}$ ]]
              [[ "$M7_EXISTING_DEPLOYMENT_TX" =~ ^0x[0-9a-f]{64}$ ]]
              [[ "$M7_EXISTING_ANCHOR_TX" =~ ^0x[0-9a-f]{64}$ ]]
              [[ "$M7_EXISTING_ANCHOR_LOG_INDEX" =~ ^(0|[1-9][0-9]*)$ ]]
              test -z "$M7_EXPECTED_DEPLOYER_NONCE"
              ;;
            *)
              echo "Unsupported M7 deployment mode" >&2
              exit 1
              ;;
          esac
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r tests/chain_anchor/requirements.txt
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.5
      - name: Build exact contract
        working-directory: chain/contracts
        run: |
          forge --version
          forge build
      - name: Resolve authoritative V1 deployment
        id: deployment
        working-directory: chain/contracts
        run: |
          umask 077
          if [[ "$M7_MODE" == 'deploy' ]]; then
            deployer=$(cast wallet address --private-key "$M7_TEST_ANCHOR_PRIVATE_KEY")
            actual_nonce=$(cast nonce --rpc-url "$BASE_SEPOLIA_RPC_URL" "$deployer")
            test "$actual_nonce" = "$M7_EXPECTED_DEPLOYER_NONCE"
            response=$(forge create --broadcast --json \
              --rpc-url "$BASE_SEPOLIA_RPC_URL" \
              --private-key "$M7_TEST_ANCHOR_PRIVATE_KEY" \
              --nonce "$M7_EXPECTED_DEPLOYER_NONCE" \
              src/KryptRoomAnchorV1.sol:KryptRoomAnchorV1)
            contract=$(jq -er '.deployedTo | ascii_downcase' <<<"$response")
            transaction=$(jq -er '.transactionHash | ascii_downcase' <<<"$response")
          else
            contract="$M7_EXISTING_CONTRACT"
            transaction="$M7_EXISTING_DEPLOYMENT_TX"
          fi
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
          echo "transaction=$transaction" >> "$GITHUB_OUTPUT"
      - name: Build and validate deployment manifest
        run: |
          mkdir -p "$RUNNER_TEMP/m7-public"
          python chain/scripts/build_deployment_manifest.py \
            --contract-address '${{ steps.deployment.outputs.contract }}' \
            --deployment-transaction '${{ steps.deployment.outputs.transaction }}' \
            --foundry-artifact chain/contracts/out/KryptRoomAnchorV1.sol/KryptRoomAnchorV1.json \
            --output "$RUNNER_TEMP/m7-public/base-sepolia-v1.json"
          test "$(jq -r '.runtimeBytecodeHash' "$RUNNER_TEMP/m7-public/base-sepolia-v1.json")" = \
            '0xd0ceef826a9258089d4d2dcdc0171aefe288ef987d92a5954bb6579de1370755'
      - name: Recompute the exact deterministic acceptance commitment
        id: commitment
        run: |
          commitment=$(python chain/scripts/compute_anchor_commitment.py \
            --room-state tests/state_proof/fixtures/S4_eval.json)
          test "$commitment" = \
            '0xbeb356e0fb84d976fea8d349f10d6aec168811e1ffc92fbea8b2ee4a04eb62d9'
          echo "value=$commitment" >> "$GITHUB_OUTPUT"
      - name: Refuse duplicate authoritative anchor before a new publication
        if: env.M7_MODE != 'resume_existing_anchor'
        run: |
          deployment_block=$(jq -er '.deploymentBlockNumber' \
            "$RUNNER_TEMP/m7-public/base-sepolia-v1.json")
          commitment=$(python chain/scripts/prepare_state_only_anchor.py \
            --contract-address '${{ steps.deployment.outputs.contract }}' \
            --deployment-block "$deployment_block" \
            --room-state tests/state_proof/fixtures/S4_eval.json)
          test "$commitment" = '${{ steps.commitment.outputs.value }}'
      - name: Publish the deterministic state-only acceptance anchor
        if: env.M7_MODE != 'resume_existing_anchor'
        id: published_anchor
        working-directory: chain/contracts
        run: |
          response=$(cast send --json \
            --rpc-url "$BASE_SEPOLIA_RPC_URL" \
            --private-key "$M7_TEST_ANCHOR_PRIVATE_KEY" \
            '${{ steps.deployment.outputs.contract }}' \
            'anchor(bytes32)' '${{ steps.commitment.outputs.value }}')
          transaction=$(jq -er '.transactionHash | ascii_downcase' <<<"$response")
          log_index=$(jq -er '.logs[0].logIndex' <<<"$response")
          echo "transaction=$transaction" >> "$GITHUB_OUTPUT"
          echo "log_index=$((log_index))" >> "$GITHUB_OUTPUT"
      - name: Bind the exact existing acceptance anchor without broadcasting
        if: env.M7_MODE == 'resume_existing_anchor'
        id: existing_anchor
        run: |
          echo "transaction=$M7_EXISTING_ANCHOR_TX" >> "$GITHUB_OUTPUT"
          echo "log_index=$M7_EXISTING_ANCHOR_LOG_INDEX" >> "$GITHUB_OUTPUT"
      - name: Record the immutable inclusion and wait for Base finality
        run: |
          python chain/scripts/record_anchor.py \
            --contract-address '${{ steps.deployment.outputs.contract }}' \
            --transaction-hash '${{ steps.existing_anchor.outputs.transaction || steps.published_anchor.outputs.transaction }}' \
            --log-index '${{ steps.existing_anchor.outputs.log_index || steps.published_anchor.outputs.log_index }}' \
            --room-state tests/state_proof/fixtures/S4_eval.json \
            --deployment-manifest "$RUNNER_TEMP/m7-public/base-sepolia-v1.json" \
            --canonical-poll-seconds 5 \
            --canonical-timeout-seconds 300 \
            --output "$RUNNER_TEMP/m7-public/chain-anchor.json"
          python chain/scripts/wait_for_finality.py \
            --deployment-manifest "$RUNNER_TEMP/m7-public/base-sepolia-v1.json" \
            --chain-anchor "$RUNNER_TEMP/m7-public/chain-anchor.json" \
            --output "$RUNNER_TEMP/m7-public/chain-anchor-status.json" \
            --poll-seconds 15 \
            --timeout-seconds 3600
      - name: Independently verify finalized chain and exact package
        run: |
          python -m engines.chain_anchor.verify_anchor \
            --rpc-url "$BASE_SEPOLIA_RPC_URL" \
            --deployment-manifest "$RUNNER_TEMP/m7-public/base-sepolia-v1.json" \
            --chain-anchor "$RUNNER_TEMP/m7-public/chain-anchor.json" \
            --room-state tests/state_proof/fixtures/S4_eval.json \
            | tee "$RUNNER_TEMP/m7-public/verifier-result.json"
          grep -q '"chainStatus":"FINALIZED"' "$RUNNER_TEMP/m7-public/verifier-result.json"
      - uses: actions/upload-artifact@v6
        with:
          name: m7-authoritative-base-sepolia-v1
          path: |
            ${{ runner.temp }}/m7-public/base-sepolia-v1.json
            ${{ runner.temp }}/m7-public/chain-anchor.json
            ${{ runner.temp }}/m7-public/chain-anchor-status.json
            ${{ runner.temp }}/m7-public/verifier-result.json
          if-no-files-found: error
          retention-days: 30
