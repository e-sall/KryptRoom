name: Committed State Transition Proof

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: state-proof-${{ github.event.pull_request.number || github.ref }}
  # One authoritative current-head PR run; preserve dev/main push runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contract-canonicalization-and-privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r tests/state_proof/requirements.txt
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: m5-contract-rust196-sp169-${{ hashFiles('engines/zk/state-transition-proof/Cargo.lock') }}
      - run: python -m unittest discover -s tests/state_proof -p 'test_*.py' -v
      - name: Pin Rust and test native guest relation with cross-language vectors
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          cargo +1.96.0 test --locked --manifest-path engines/zk/state-transition-proof/Cargo.toml -p kryptroom-proof-relation
      - name: Ensure deterministic metadata fixture regeneration
        run: |
          python tests/state_proof/generate_fixture.py
          git diff --exit-code -- tests/state_proof/fixtures
