name: M8 Web Foundation

on:
  pull_request:
    branches: [dev, main]
    paths: ['apps/web/**', 'docs/m8/**', 'ARCHITECTURE.md', 'PROJECT_CONTEXT.md', 'CHANGELOG.md', 'TODO.md', 'docs/DECISIONS.md', '.github/workflows/**', '.github/ci_scope.py', '.github/test_ci_scope.py']
  push:
    branches: [dev, main]
    paths: ['apps/web/**', 'docs/m8/**', 'ARCHITECTURE.md', 'PROJECT_CONTEXT.md', 'CHANGELOG.md', 'TODO.md', 'docs/DECISIONS.md', '.github/workflows/**', '.github/ci_scope.py', '.github/test_ci_scope.py']
  workflow_dispatch:

concurrency:
  group: web-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # scope migration tests compare immutable pre-migration blobs
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify pinned package manager
        run: test "$(npm --version)" = "10.9.4"
      - name: Verify frontend/core CI scope decisions
        run: python3 -m unittest discover -s ../../.github -p 'test_ci_scope.py' -v
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: m8-foundation-browser-evidence
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: warn
