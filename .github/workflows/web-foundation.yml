name: M8 Web Foundation

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: web-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # scope migration tests compare immutable pre-migration blobs
      - name: Verify routing policy without frontend dependencies
        working-directory: .
        run: python3 -m unittest discover -s .github -p 'test_*ci_scope.py' -v
      - name: Classify frontend applicability
        id: scope
        working-directory: .
        run: python3 .github/ci_scope.py
      - name: Explicit frontend non-applicability
        if: steps.scope.outputs.web != 'true'
        run: echo "Frontend checks not applicable; classification succeeded"
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.web == 'true'
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify pinned package manager
        if: steps.scope.outputs.web == 'true'
        run: test "$(npm --version)" = "10.9.4"
      - name: Verify frontend/core CI scope decisions
        if: steps.scope.outputs.web == 'true'
        run: python3 -m unittest discover -s ../../.github -p 'test_ci_scope.py' -v
      - run: npm ci
        if: steps.scope.outputs.web == 'true'
      - run: npm run lint
        if: steps.scope.outputs.web == 'true'
      - run: npm test
        if: steps.scope.outputs.web == 'true'
      - run: npm run build
        if: steps.scope.outputs.web == 'true'
      - run: npm run typecheck
        if: steps.scope.outputs.web == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.scope.outputs.web == 'true'
      - run: npm run test:e2e
        if: steps.scope.outputs.web == 'true'
      - uses: actions/upload-artifact@v6
        if: always() && steps.scope.outputs.web == 'true'
        with:
          name: m8-foundation-browser-evidence
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: warn
