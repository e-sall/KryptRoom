<script>
(()=>{
const root=document.getElementById('kr3401');
if(!root||root.dataset.ready)return;
root.dataset.ready='1';
const $=id=>root.querySelector('#'+id);
const inv=$('kr34inv'),room=$('kr34room'),datasets=$('kr34datasetsNav');
const rows1=$('kr34rows1'),rows2=$('kr34rows2'),actions=$('kr34roomActions');
const hover=$('kr34btnHover'),normal=$('kr34btnNormal'),busy=$('kr34btnBusy'),spinner=$('kr34spinner');
const connectHover=$('kr34connectHover'),cursor=$('kr34cursor'),ripple=$('kr34click');
const play=$('kr34play'),replay=$('kr34replay'),seek=$('kr34seek'),clock=$('kr34clock'),stage=$('kr34stage');
const D=7200;
let t=0,last=null,playing=true;
const clamp=x=>Math.max(0,Math.min(1,x));
const cubic=(a,b,c,d,u)=>{let v=1-u;return v*v*v*a+3*v*v*u*b+3*v*u*u*c+u*u*u*d};
function bezierEase(p,x1=.45,y1=0,x2=.23,y2=1){
p=clamp(p);let low=0,high=1;
for(let i=0;i<20;i++){let m=(low+high)/2;if(cubic(0,x1,x2,1,m)<p)low=m;else high=m}
return cubic(0,y1,y2,1,(low+high)/2);
}
const ease=(a,b)=>bezierEase((t-a)/(b-a));
const fade=(a,b)=>bezierEase((t-a)/(b-a),.15,.25,.23,1);
function curve(a,b,c,d,p){
return {x:cubic(a.x,b.x,c.x,d.x,p),y:cubic(a.y,b.y,c.y,d.y,p)};
}
function pointer(){
if(t<480)return {x:953,y:439};
if(t<1460)return curve({x:953,y:439},{x:854,y:438},{x:735,y:500},{x:627,y:500},ease(480,1460));
if(t<4060)return {x:627,y:500};
if(t<5290)return curve({x:627,y:500},{x:705,y:479},{x:842,y:475},{x:949,y:500},ease(4060,5290));
return {x:949,y:500};
}
function render(){
const switching=fade(2700,3030);
inv.setAttribute('opacity',String(1-switching));
room.setAttribute('opacity',String(switching));
datasets.setAttribute('opacity',String(fade(3090,3410)));
rows1.setAttribute('opacity',String(fade(3150,3420)));
rows2.setAttribute('opacity',String(fade(3340,3610)));
actions.setAttribute('opacity',String(fade(3490,3760)));

hover.setAttribute('opacity',String(t>=1440&&t<2050?fade(1380,1570):0));
const loading=fade(2040,2150);
normal.setAttribute('opacity',String(1-loading));
busy.setAttribute('opacity',String(loading));
spinner.setAttribute('transform',`rotate(${(t*0.22).toFixed(1)} 564 500)`);
connectHover.setAttribute('opacity',String(t>5340?fade(5330,5510):0));

let pos=pointer();
const mouseOpacity=t<2800?1: t<3850?1-fade(2780,3040):fade(3750,3990);
cursor.setAttribute('opacity',String(mouseOpacity));
cursor.setAttribute('transform',`translate(${pos.x.toFixed(2)} ${pos.y.toFixed(2)})`);

if(t>=1960&&t<2150){
const p=clamp((t-1960)/190);
ripple.setAttribute('opacity',String((1-p)*.65));
ripple.setAttribute('transform','translate(627 500)');
ripple.querySelector('circle').setAttribute('r',String(9+p*17));
}else ripple.setAttribute('opacity','0');

const labels=[
[0,'03 · Invitation awaiting acceptance'],
[480,'Move to Accept & open Room'],
[1500,'Button in focus · Micro-pause'],
[1960,'Click · Accept & open Room'],
[2040,'Validating membership'],
[2700,'Opening Supply Chain Collaboration'],
[3140,'04 · Both organizations joined'],
[3350,'Four local datasets · Not linked'],
[4140,'Logistics Partner can now connect its datasets'],
[5530,'04 · Room ready · Next action available']
];
let current=labels[0][1];
for(const [at,label] of labels)if(t>=at)current=label;
stage.textContent=current;
seek.value=Math.round(t);
clock.textContent=(t/1000).toFixed(1)+' / 7.2s';
$('kr34acceptHit').style.pointerEvents=t<2110?'auto':'none';
}
function tick(now){
if(last===null)last=now;
const dt=Math.min(80,now-last);last=now;
if(playing){t=Math.min(D,t+dt);if(t>=D){playing=false;play.textContent='Play'}}
render();requestAnimationFrame(tick);
}
function pause(){playing=false;last=null;play.textContent='Play';render()}
function start(){playing=true;last=null;play.textContent='Pause';render()}
play.addEventListener('click',()=>{if(playing)pause();else{if(t>=D)t=0;start()}});
replay.addEventListener('click',()=>{t=0;start()});
seek.addEventListener('input',()=>{t=Number(seek.value);pause()});
$('kr34acceptHit').addEventListener('click',()=>{if(t<2100){t=1960;start()}});
$('kr34acceptHit').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&t<2100){e.preventDefault();t=1960;start()}});
if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){playing=false;play.textContent='Play'}
render();requestAnimationFrame(tick);
})();
</script>
</div>
</body></html>
