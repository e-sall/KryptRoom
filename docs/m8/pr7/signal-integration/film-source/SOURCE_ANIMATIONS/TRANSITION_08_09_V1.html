<script>
(()=>{
const root=document.getElementById('kr8901');
if(!root||root.dataset.ready)return;
root.dataset.ready='1';
const $=id=>root.querySelector('#'+id);
const D=8600;
let t=0,last=null,playing=true;
const play=$('kr89play'),replay=$('kr89replay'),seek=$('kr89seek'),clock=$('kr89clock'),stage=$('kr89stage');
const clamp=x=>Math.max(0,Math.min(1,x));
const cubic=(a,b,c,d,u)=>{const v=1-u;return v*v*v*a+3*v*v*u*b+3*v*u*u*c+u*u*u*d};
function timing(p,x1=.45,y1=0,x2=.23,y2=1){
p=clamp(p);let lo=0,hi=1;
for(let i=0;i<19;i++){
const mid=(lo+hi)/2;
if(cubic(0,x1,x2,1,mid)<p)lo=mid;else hi=mid;
}
return cubic(0,y1,y2,1,(lo+hi)/2);
}
const motion=(a,b)=>timing((t-a)/(b-a));
const fade=(a,b)=>timing((t-a)/(b-a),.15,.45,.24,1);
const route=(a,b,c,d,p)=>({x:cubic(a.x,b.x,c.x,d.x,p),y:cubic(a.y,b.y,c.y,d.y,p)});
const op=(id,v)=>$(id).setAttribute('opacity',String(clamp(v)));
const line=$('kr89trend');
const lineLen=line.getTotalLength?line.getTotalLength():540;
line.setAttribute('stroke-dasharray',String(lineLen));
function pointer(){
if(t<440)return{x:97,y:344};
if(t<1570)return route({x:97,y:344},{x:137,y:362},{x:226,y:483},{x:325,y:490},motion(440,1570));
if(t<6150)return{x:325,y:490};
if(t<7350)return route({x:325,y:490},{x:480,y:462},{x:755,y:481},{x:930,y:511},motion(6150,7350));
return{x:930,y:511};
}
function render(){
const screen=fade(2650,2930);
op('kr89gallery',1-screen);
op('kr89overview',screen);
const entering=fade(3000,3310);
op('kr89metrics',entering);
$('kr89metrics').setAttribute('transform',`translate(0 ${(1-entering)*5})`);

const count=motion(3190,4290);
for(const [id,max] of [['kr89total',12],['kr89production',6],['kr89transit',4],['kr89other',2]]){
$(id).textContent=String(Math.round(max*count));
}
const chart=motion(3720,5400);
line.setAttribute('stroke-dashoffset',String(lineLen*(1-chart)));
op('kr89area',chart*.85);
const dots=$('kr89dots').querySelectorAll('circle');
dots.forEach((dot,i)=>{
const p=fade(3880+i*205,4070+i*205);
dot.setAttribute('opacity',String(p));
dot.setAttribute('transform',`translate(0 ${(1-p)*3})`);
});
for(const [id,max,start,end] of [
['kr89bar1',127.5,3890,4900],
['kr89bar2',85,4010,5100],
['kr89bar3',42.5,4130,5290]
]){
$(id).setAttribute('width',String(max*motion(start,end)));
}

const pos=pointer();
$('kr89cursor').setAttribute('transform',`translate(${pos.x.toFixed(2)} ${pos.y.toFixed(2)})`);
const visibility=t<2550?1:t<3350?1-fade(2540,2950):fade(5810,6130);
op('kr89cursor',visibility);
op('kr89ctaHover',t>=1550&&t<2160?fade(1540,1690)*(1-fade(2020,2200)):0);
op('kr89busy',fade(2100,2200)*(1-fade(2570,2740)));
$('kr89spinner').setAttribute('transform',`rotate(${(t*.25).toFixed(1)} 269 493)`);
op('kr89detailHover',t>=7280?fade(7260,7450):0);

if(t>=2010&&t<2200){
const p=clamp((t-2010)/190);
$('kr89click').setAttribute('transform','translate(325 490)');
op('kr89click',(1-p)*.68);
$('kr89click').querySelector('circle').setAttribute('r',String(9+17*p));
}else op('kr89click',0);
$('kr89hit').style.pointerEvents=t<2190?'auto':'none';

const labels=[
[0,'08 · Supply Chain Risk ready · Analytics Gallery'],
[440,'Cursor moves toward Open dashboard'],
[1580,'Open dashboard · Hover'],
[2010,'Click · Open dashboard'],
[2140,'Opening authorized analysis'],
[2680,'Navigating to Risk Overview'],
[3160,'09 · Risk overview · Aggregate indicators loading'],
[3930,'12 illustrative signals · Production 6 · Transit 4 · Other 2'],
[4530,'Weekly risk trend is appearing'],
[5500,'Authorized overview ready'],
[6170,'Cursor moves toward detailed dashboard'],
[7470,'09 · Open detailed dashboard · Next transition']
];
let label=labels[0][1];
for(const [at,s] of labels)if(t>=at)label=s;
stage.textContent=label;
seek.value=Math.round(t);
clock.textContent=(t/1000).toFixed(1)+' / 8.6s';
}
function tick(now){
if(last===null)last=now;
const dt=Math.min(80,now-last);last=now;
if(playing){t=Math.min(D,t+dt);if(t>=D){playing=false;play.textContent='Play';}}
render();requestAnimationFrame(tick);
}
function pause(){playing=false;last=null;play.textContent='Play';render();}
function start(){playing=true;last=null;play.textContent='Pause';render();}
play.addEventListener('click',()=>{if(playing)pause();else{if(t>=D)t=0;start();}});
replay.addEventListener('click',()=>{t=0;start();});
seek.addEventListener('input',()=>{t=Number(seek.value);pause();});
$('kr89hit').addEventListener('click',()=>{if(t<2190){t=2010;start();}});
$('kr89hit').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&t<2190){e.preventDefault();t=2010;start();}});
if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){playing=false;play.textContent='Play';}
render();requestAnimationFrame(tick);
})();
</script>
</div>
</body></html>
