<script>
(()=>{
const root=document.getElementById('kr111v2');
if(!root||root.dataset.ready)return;
root.dataset.ready='1';
const $=id=>root.querySelector('#'+id);
const D=9400,clamp=x=>Math.max(0,Math.min(1,x));
const cubic=(a,b,c,d,u)=>{const v=1-u;return v*v*v*a+3*v*v*u*b+3*v*u*u*c+u*u*u*d};
function ease(p,x1=.45,y1=0,x2=.23,y2=1){
p=clamp(p);let a=0,b=1;
for(let i=0;i<18;i++){const m=(a+b)/2;if(cubic(0,x1,x2,1,m)<p)a=m;else b=m}
return cubic(0,y1,y2,1,(a+b)/2);
}
let t=0,last=null,playing=true;
const fade=(a,b)=>ease((t-a)/(b-a),.14,.4,.24,1);
const move=(a,b)=>ease((t-a)/(b-a));
const op=(id,p)=>$(id).setAttribute('opacity',String(clamp(p)));
const route=(a,b,c,d,p)=>({x:cubic(a.x,b.x,c.x,d.x,p),y:cubic(a.y,b.y,c.y,d.y,p)});
const question="What's driving our supply chain risks, and what should we do?";
const play=$('kr111play'),replay=$('kr111replay'),seek=$('kr111seek'),clock=$('kr111time'),status=$('kr111status');
const typingStart=2300,typingEnd=5500;
const times=[typingStart];let w=0,weights=[];
for(let i=0;i<question.length;i++){
let z=12+(i*17%13)+(question[i]===' '?6:0)+(question[i]===','?30:0);
weights.push(z);w+=z;
}
let running=typingStart;
for(const weight of weights){running+=(typingEnd-typingStart)*weight/w;times.push(running);}
function count(){
let n=0;while(n<question.length&&times[n+1]<=t)n++;return n;
}
function pointer(){
if(t<400)return{x:886,y:476};
if(t<1000)return route({x:886,y:476},{x:904,y:478},{x:939,y:500},{x:933,y:510},move(400,1000));
if(t<5650)return{x:933,y:510};
if(t<6200)return route({x:635,y:485},{x:659,y:475},{x:699,y:476},{x:720,y:490},move(5650,6200));
return{x:720,y:490};
}
function render(){
const swap=fade(1600,1950);
op('kr111dashboard',1-swap);op('kr111ai',swap);
op('kr111nav0',1-swap);op('kr111nav1',swap);
op('kr111hover1',t<1150?fade(890,1060):0);
$('kr111hit1').style.pointerEvents=t<1310?'auto':'none';
const n=count();
const typed=$('kr111typed');
typed.textContent=question.slice(0,n);
op('kr111placeholder',t<typingStart?1:0);
const width=typed.getComputedTextLength?typed.getComputedTextLength():n*6.1;
$('kr111caret').setAttribute('d',`M${(246+width+2).toFixed(1)} 471 V490`);
op('kr111caret',t>=typingStart&&t<6360&&Math.sin(t/175)>-.2?1:0);
const sent=t>=6560;
op('kr111compose',1-fade(6530,6710));
op('kr111after',fade(6530,6710));
op('kr111empty',1-fade(6500,6750));
op('kr111message',fade(6570,6850));
op('kr111working',fade(6990,7300));
$('kr111sendBG').setAttribute('fill',sent?'#8a8c8f':'#f1f0eb');
op('kr111hover2',t>=6130&&t<6510?fade(6090,6240):0);
$('kr111hit2').style.pointerEvents=t>=5500&&t<6490?'auto':'none';
const dots=$('kr111dots').querySelectorAll('circle');
dots.forEach((d,i)=>d.setAttribute('opacity',String(.3+.7*Math.pow(Math.sin(t/245-i*.8),2))));
$('kr111workingText').textContent=t>=8260?'Organizing authorized insights...':t>=7650?'Reviewing aggregate risk context...':'Analyzing authorized context...';
const p=pointer();
$('kr111cursor').setAttribute('transform',`translate(${p.x.toFixed(2)} ${p.y.toFixed(2)})`);
op('kr111cursor',t<1550?1:t<5600?1-fade(1520,1780):t<6740?fade(5600,5820):1-fade(6520,6740));
let tap=t>=1140&&t<1330?{at:1140,x:933,y:510}:t>=6380&&t<6570?{at:6380,x:720,y:490}:null;
if(tap){
const u=clamp((t-tap.at)/190);
$('kr111ripple').setAttribute('transform',`translate(${tap.x} ${tap.y})`);
$('kr111ripple').querySelector('circle').setAttribute('r',String(9+17*u));
op('kr111ripple',(1-u)*.7);
}else op('kr111ripple',0);
const states=[[0,'10 · Dashboard · Ask AI ready'],[1140,'Click · Ask AI'],[1700,'11 · AI workspace opened'],[2300,'Typing the question on one line'],[5500,'Question complete'],[6380,'Click · Send'],[6600,'Question submitted on one line'],[7100,'AI analyzing authorized context'],[8250,'Answer still being prepared']];
let s=states[0][1];for(const [at,label] of states)if(t>=at)s=label;
status.textContent=s;seek.value=Math.round(t);clock.textContent=(t/1000).toFixed(1)+' / 9.4s';
}
function frame(now){
if(last===null)last=now;
const dt=Math.min(80,now-last);last=now;
if(playing){t=Math.min(D,t+dt);if(t===D){playing=false;play.textContent='Play';}}
render();requestAnimationFrame(frame);
}
function pause(){playing=false;last=null;play.textContent='Play';render()}
function start(){playing=true;last=null;play.textContent='Pause';render()}
play.addEventListener('click',()=>{if(playing)pause();else{if(t>=D)t=0;start()}});
replay.addEventListener('click',()=>{t=0;start()});
seek.addEventListener('input',()=>{t=Number(seek.value);pause()});
$('kr111hit1').addEventListener('click',()=>{if(t<1310){t=1140;start()}});
$('kr111hit2').addEventListener('click',()=>{if(t>=5500&&t<6490){t=6380;start()}});
if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){playing=false;play.textContent='Play'}
render();requestAnimationFrame(frame);
})();
</script>
