[workspace]
members = ["shared", "program", "host"]
resolver = "2"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
hex = "=0.4.3"
base64 = "=0.22.1"

# Official SP1 6.9.0 patch-testing revision; identical SHA-256 semantics,
# accelerated zkVM syscalls instead of interpreting every SHA round.
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", rev = "e48b656ebc806117554bb33c2f8687e4637e37ff" }

