# Local/CI native Linux fixture only. Every listener binds loopback, no public service.
name: kryptroom-m9-identity
services:
  identity-prepare:
    build: {context: ., target: test}
    user: '0:0'
    entrypoint: [python, scripts/identity-local.py]
    network_mode: none
    volumes: [./.runtime:/app/.runtime]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
  prepare-secrets:
    extends: {file: compose.yml, service: prepare-secrets}
  postgres:
    extends: {file: compose.yml, service: postgres}
    networks: !reset []
    network_mode: host
    command: [postgres, -c, listen_addresses=127.0.0.1, -p, '5435', -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_parameter_max_length_on_error=0]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -p 5435 -U postgres -d kryptroom']
  migrate:
    extends: {file: compose.yml, service: migrate}
    networks: !reset []
    network_mode: host
    environment:
      CONTROL_DATABASE_HOST: 127.0.0.1
      CONTROL_DATABASE_PORT: '5435'
  api:
    extends: {file: compose.yml, service: api}
    networks: !reset []
    ports: !reset []
    network_mode: host
    command: [uvicorn, 'kryptroom_control.app:create_app', --factory, --host, 127.0.0.1, --port, '8001', --no-access-log, --no-proxy-headers]
    environment:
      CONTROL_DATABASE_HOST: 127.0.0.1
      CONTROL_DATABASE_PORT: '5435'
      CONTROL_OIDC_ISSUER: https://127.0.0.1:8444/realms/kryptroom-dev
      CONTROL_OIDC_CLIENT_SECRET_FILE: /run/identity/oidc_api_secret
      SSL_CERT_FILE: /run/identity-ca.crt
    volumes:
      - ./.runtime/identity/api:/run/identity:ro
      - ./.runtime/identity/tls/ca.crt:/run/identity-ca.crt:ro
    depends_on:
      identity-prepare: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:3879c623248408de29a5303178b5816c77e8dfef3890c361f8c0bbeaa979ba3b
    network_mode: host
    entrypoint: [/bin/bash, -ec]
    command:
      - 'IFS= read -r KC_DB_PASSWORD < /run/identity/keycloak_password || test -n "$$KC_DB_PASSWORD"; export KC_DB_PASSWORD; exec /opt/keycloak/bin/kc.sh start-dev --import-realm'
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://127.0.0.1:5435/keycloak
      KC_DB_USERNAME: kryptroom_keycloak
      KC_HOSTNAME: https://127.0.0.1:8444
      KC_HTTP_ENABLED: 'false'
      KC_HTTP_HOST: 127.0.0.1
      KC_HTTPS_PORT: '8444'
      KC_HTTPS_CERTIFICATE_FILE: /run/tls/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /run/tls/server.key
      KC_HTTP_ACCESS_LOG_ENABLED: 'false'
    volumes:
      - ./.runtime/identity/keycloak:/run/identity:ro
      - ./.runtime/identity/keycloak/kryptroom-dev-realm.json:/opt/keycloak/data/import/kryptroom-dev-realm.json:ro
      - ./.runtime/identity/tls:/run/tls:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres: {condition: service_healthy}
      identity-prepare: {condition: service_completed_successfully}
  bff:
    build: {context: ../../apps/web, dockerfile: Dockerfile.identity}
    network_mode: host
    environment:
      KR_BFF_PROFILE: local
      KR_BFF_ORIGIN: http://127.0.0.1:3004
      KR_API_ORIGIN: http://127.0.0.1:8001
      KR_OIDC_ISSUER: https://127.0.0.1:8444/realms/kryptroom-dev
      KR_BFF_DB_PORT: '5435'
      KR_BFF_DB_PASSWORD_FILE: /run/identity/bff_password
      KR_BFF_ENCRYPTION_KEY_FILE: /run/identity/bff_encryption_key
      KR_BFF_HASH_KEY_FILE: /run/identity/bff_hash_key
      KR_OIDC_BFF_SECRET_FILE: /run/identity/oidc_bff_secret
      NODE_EXTRA_CA_CERTS: /run/identity-ca.crt
    volumes:
      - ./.runtime/identity/bff:/run/identity:ro
      - ./.runtime/identity/tls/ca.crt:/run/identity-ca.crt:ro
    read_only: true
    tmpfs: ['/app/.next/cache:uid=10001,gid=10001,mode=0700']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: {condition: service_started}
      keycloak: {condition: service_started}
      identity-prepare: {condition: service_completed_successfully}
  operator:
    profiles: [operator]
    build: {context: ., target: runtime}
    entrypoint: [python, -m, kryptroom_control.operator_cli]
    network_mode: host
    environment:
      CONTROL_DATABASE_HOST: 127.0.0.1
      CONTROL_DATABASE_PORT: '5435'
      CONTROL_DATABASE_USER: kryptroom_operator
      CONTROL_DATABASE_PASSWORD_FILE: /run/identity/operator_password
      CONTROL_DATABASE_SSLMODE: disable
    volumes: [./.runtime/identity/operator:/run/identity:ro]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  pgdata:
  postgres-secrets:
  migrator-secrets:
  api-secrets:
  test-secrets:
secrets:
  postgres_password: {file: ./.runtime/secrets/postgres_password}
  migrator_password: {file: ./.runtime/secrets/migrator_password}
  app_password: {file: ./.runtime/secrets/app_password}
  operator_password: {file: ./.runtime/secrets/operator_password}
  bff_password: {file: ./.runtime/secrets/bff_password}
  keycloak_password: {file: ./.runtime/secrets/keycloak_password}
