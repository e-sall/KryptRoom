[project]
name = "kryptroom-control-api"
version = "0.1.0"
description = "M9 control-plane foundation; no cryptographic execution authority"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "SQLAlchemy==2.1.7",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.7",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx2==2.16.0", "pytest==9.2.0", "pytest-cov==7.1.0",
  "ruff==0.17.3", "mypy==2.4.1", "pip-audit==2.10.1",
  "build==1.6.1", "hatchling==1.33.0", "PyYAML==6.0.3",
  "uv==0.13.7",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kryptroom_control"]

[tool.hatch.build]
exclude = ["**/__pycache__/**", "**/*.py[cod]", "**/*.egg-info/**", ".runtime/**", ".venv/**"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/kryptroom_control", "migrations", "tests", "scripts", "README.md",
  "pyproject.toml", "alembic.ini", "Dockerfile", ".dockerignore", ".gitattributes",
  ".gitignore", ".python-version", "compose.yml", "requirements.lock",
  "requirements-dev.lock", "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: requires an isolated PostgreSQL 17 test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
